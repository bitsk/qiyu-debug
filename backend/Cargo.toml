[package]
name = "mix-camera-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mix-debug-server"
path = "src/console/main.rs"
required-features = ["webrtc"]

[dependencies]
libc = "0.2.183"
serde_json = "1.0.149"
base64 = "0.22"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
gstreamer = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-app = { version = "0.24", features = ["v1_22"], optional = true }
gstreamer-sdp = { version = "0.24", optional = true }
gstreamer-webrtc = { version = "0.24", features = ["v1_22"], optional = true }

[features]
webrtc = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-sdp", "dep:gstreamer-webrtc"]

[profile.release]
panic = "abort"
lto = true
strip = true
